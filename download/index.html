<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Gallery Downloads | Tony Russell Photography</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --btn-free: #28a745;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; }
        p { color: #a0a0a0; font-size: 0.95rem; margin-top: 0; margin-bottom: 25px; }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            width: 100%;
            margin-bottom: 40px;
        }

        .photo-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .card-details { padding: 15px; }

        .btn {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            text-align: center;
        }

        .btn-free { background-color: var(--btn-free); }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Free Photo Downloads</h1>
            <p>Tony Russell Photography</p>
        </header>

        <div class="gallery-grid">

            <div class="photo-card">
                <!-- Look directly in the download folder -->
                <img src="photo1.jpg" alt="Photo 1">
                <div class="card-details">

                </div>
